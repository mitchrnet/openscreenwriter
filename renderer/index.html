<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com" />
  <title>OpenScreenwriter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Startup modal -->
  <div id="startup-modal">
    <div id="startup-card">
      <div class="startup-logo">&#9670; OPENSCREENWRITER</div>

      <div class="startup-section">
        <div class="startup-label">Theme</div>
        <div class="startup-theme-row">
          <button class="startup-theme-btn" data-theme-btn="dark">Dark</button>
          <button class="startup-theme-btn" data-theme-btn="light">Light</button>
        </div>
      </div>

      <div class="startup-divider"></div>

      <div class="startup-actions">
        <button class="startup-action-btn" id="startup-new">New Script</button>
        <button class="startup-action-btn" id="startup-open">Open File&#8230;</button>
      </div>
    </div>
  </div>

  <div id="toolbar">
    <button class="toolbar-btn toolbar-fmt-btn" id="btn-scene-nav" title="Toggle Panel (☰)">☰</button>
    <span class="toolbar-logo">OPENSCREENWRITER</span>
    <div id="element-dropdown-wrapper">
      <span class="element-pill" id="element-pill">Action ▾</span>
      <div id="element-dropdown" style="display:none">
        <button class="element-dropdown-item" data-set-type="scene_heading">Scene Heading</button>
        <button class="element-dropdown-item" data-set-type="action">Action</button>
        <button class="element-dropdown-item" data-set-type="character">Character</button>
        <button class="element-dropdown-item" data-set-type="dialogue">Dialogue</button>
        <button class="element-dropdown-item" data-set-type="parenthetical">Parenthetical</button>
        <button class="element-dropdown-item" data-set-type="transition">Transition</button>
        <button class="element-dropdown-item" data-set-type="centered">Centered</button>
        <button class="element-dropdown-item" data-set-type="lyric">Lyric</button>
      </div>
    </div>
    <div class="toolbar-edit-group">
      <button class="toolbar-btn toolbar-fmt-btn" id="btn-undo" title="Undo (Ctrl+Z)">&#x21A9;</button>
      <button class="toolbar-btn toolbar-fmt-btn" id="btn-redo" title="Redo (Ctrl+Y)">&#x21AA;</button>
    </div>
    <div class="toolbar-format-group">
      <button class="toolbar-btn toolbar-fmt-btn" id="btn-bold" title="Bold (Ctrl+B)"><strong>B</strong></button>
      <button class="toolbar-btn toolbar-fmt-btn" id="btn-italic" title="Italic (Ctrl+I)"><em>I</em></button>
      <button class="toolbar-btn toolbar-fmt-btn" id="btn-underline" title="Underline (Ctrl+U)"><u>U</u></button>
    </div>
    <div class="toolbar-spacer"></div>
    <button class="toolbar-btn toolbar-fmt-btn" id="btn-theme-toggle" title="Toggle theme"></button>
  </div>

  <div id="editor-container">
    <div id="side-panel">
      <div class="side-panel-tabs">
        <button class="side-panel-tab active" data-tab="scenes">Scenes</button>
        <button class="side-panel-tab" data-tab="script-info">Script Info</button>
      </div>
      <div class="side-panel-content" id="tab-scenes">
        <div id="scene-nav-list">
          <div class="scene-nav-empty">No scenes yet</div>
        </div>
      </div>
      <div class="side-panel-content" id="tab-script-info" style="display:none">
        <div class="sp-field">
          <label>Title</label>
          <input type="text" id="sp-title" />
        </div>
        <div class="sp-field">
          <label>Credit</label>
          <input type="text" id="sp-credit" placeholder="Written by" />
        </div>
        <div class="sp-field">
          <label>Author</label>
          <input type="text" id="sp-author" />
        </div>
        <div class="sp-field">
          <label>Source</label>
          <input type="text" id="sp-source" />
        </div>
        <div class="sp-field">
          <label>Draft Date</label>
          <input type="text" id="sp-draft-date" />
        </div>
        <div class="sp-divider"></div>
        <div class="sp-field">
          <label>Contact</label>
          <textarea id="sp-contact" rows="3"></textarea>
        </div>
        <div class="sp-field">
          <label>Contact Position</label>
          <div class="sp-toggle-row">
            <button class="sp-toggle-btn active" data-pos="left">Left</button>
            <button class="sp-toggle-btn" data-pos="right">Right</button>
          </div>
        </div>
      </div>
    </div>
    <div id="editor-pane">
      <div id="editor-paper">
        <div id="wysiwyg-editor"></div>
        <textarea id="source-editor" style="display:none" spellcheck="false"></textarea>
      </div>
    </div>
  </div>

  <div id="statusbar">
    <span id="status-filename">untitled.fountain</span>
    <span id="status-pages">~1 page</span>
  </div>

  <!-- Custom context menu -->
  <div id="context-menu" style="display:none">
    <button class="context-menu-item" data-action="cut">Cut</button>
    <button class="context-menu-item" data-action="copy">Copy</button>
    <button class="context-menu-item" data-action="paste">Paste</button>
    <div class="context-menu-divider"></div>
    <button class="context-menu-item" data-action="bold"><strong>Bold</strong></button>
    <button class="context-menu-item" data-action="italic"><em>Italic</em></button>
    <button class="context-menu-item" data-action="underline"><u>Underline</u></button>
  </div>

  <!-- Title Page Wizard modal -->
  <div id="title-page-wizard" style="display:none">
    <div id="tp-wizard-card">
      <div class="startup-logo">TITLE PAGE</div>
      <div class="tp-wizard-form">
        <div class="sp-field">
          <label>Title <span class="tp-required">*</span></label>
          <input type="text" id="tp-wiz-title" />
        </div>
        <div class="sp-field">
          <label>Credit</label>
          <input type="text" id="tp-wiz-credit" placeholder="Written by" />
        </div>
        <div class="sp-field">
          <label>Author</label>
          <input type="text" id="tp-wiz-author" />
        </div>
        <div class="sp-field">
          <label>Source</label>
          <input type="text" id="tp-wiz-source" />
        </div>
        <div class="sp-field">
          <label>Draft Date</label>
          <input type="text" id="tp-wiz-draft-date" />
        </div>
        <div class="sp-divider"></div>
        <div class="sp-field">
          <label>Contact</label>
          <textarea id="tp-wiz-contact" rows="3" placeholder="Name&#10;Email&#10;Phone"></textarea>
        </div>
        <div class="sp-field">
          <label>Contact Position</label>
          <div class="sp-toggle-row">
            <button class="sp-toggle-btn active" data-pos="left" id="tp-wiz-pos-left">Left</button>
            <button class="sp-toggle-btn" data-pos="right" id="tp-wiz-pos-right">Right</button>
          </div>
        </div>
      </div>
      <div class="tp-wizard-footer">
        <button class="startup-action-btn" id="tp-wiz-cancel">Cancel</button>
        <button class="startup-action-btn tp-wiz-submit" id="tp-wiz-submit">Insert Title Page</button>
      </div>
    </div>
  </div>

  <!-- About modal -->
  <div id="about-modal" style="display:none">
    <div id="about-card">
      <div class="startup-logo">&#9670; OPENSCREENWRITER</div>
      <div id="about-version">v1.1.0</div>
      <p>&#169; 2026 Mitchell Reid</p>
      <p>Released under the <strong>MIT License</strong>.</p>
      <p>A minimalist screenplay editor for Fountain format with Final Draft export.</p>
      <a href="#" id="about-github-link">github.com/mitchrnet/openscreenwriter</a>
      <div class="startup-divider"></div>
      <button class="startup-action-btn" id="about-close">Close</button>
    </div>
  </div>

  <script type="module" src="editor.bundle.js"></script>
</body>
</html>
